name: Auto Compress Images
on:
  push:
    branches: [main]
    paths: ['**.jpg', '**.jpeg', '**.png', '**.webp']
jobs:
  build:
    name: image-compress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pngQuality: '80'
          webpQuality: '80'
